<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EMG v0.2.1</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1c2027;--line:#2a2f38;--ink:#e8eaee;--dim:#8a919c;--acc:#ff7a2f;--ok:#38d27a;--warn:#ffc940;--bad:#ff4d5e;--rec:#ff3b4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{touch-action:manipulation;margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 -apple-system,"Helvetica Neue","Hiragino Sans",sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:52px 1fr 230px;height:100%;padding:max(8px,env(safe-area-inset-top)) 10px 10px;gap:8px}
header{display:flex;align-items:center;gap:8px}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px;margin-right:4px}.logo small{color:var(--dim);font-weight:600;font-size:10px;letter-spacing:.06em;margin-left:5px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;height:40px;min-width:52px;padding:0 12px;font-weight:650;font-size:12.5px;letter-spacing:.05em;white-space:nowrap}
.btn.on{background:var(--acc);border-color:var(--acc);color:#111}
.btn.rec.on{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.sm{height:32px;min-width:38px;padding:0 9px;font-size:11.5px}
.btn.big{min-width:78px;font-size:14px}
.btn:disabled{opacity:.35}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg .btn{border:0;border-radius:0;border-right:1px solid var(--line)}.seg .btn:last-child{border-right:0}
.spacer{flex:1}
.bpm{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 4px;height:40px}
.bpm b{font-size:19px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.bpm .btn{height:30px;min-width:30px;padding:0}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;height:40px;padding:0 6px;font:650 12px inherit}
.lampBtn{display:flex;align-items:center;gap:6px}
.lamp{width:12px;height:12px;border-radius:50%;background:#444}
.lamp.ok{background:var(--ok)}.lamp.warn{background:var(--warn)}.lamp.bad{background:var(--bad)}
.page{display:none;min-height:0}.page.on{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0}
/* ---- SEQ ---- */
#seqPage{grid-template-columns:196px minmax(0,1fr);gap:8px}
#tracks{display:flex;flex-direction:column;gap:4px;padding:6px;overflow:hidden}
.trk{display:grid;grid-template-columns:6px 1fr 30px 30px;align-items:center;gap:6px;height:calc((100% - 44px)/12);min-height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 6px 0 0;position:relative;overflow:hidden}
.trk .bar{height:100%;border-radius:8px 0 0 8px}
.trk .nm{font-weight:700;font-size:12px;letter-spacing:.04em;line-height:1.1}
.trk .nm small{display:block;color:var(--dim);font-weight:600;font-size:10px;letter-spacing:.08em}
.trk.sel{border-color:#fff8;background:#262b34}
.trk.empty .nm{color:#59606b}
.trk .ms{height:26px;min-width:0;padding:0;font-size:10.5px;border-radius:6px}
.trk .ms.on.m{background:#5a6270;border-color:#5a6270;color:#fff}.trk .ms.on.s{background:var(--warn);border-color:var(--warn);color:#111}
.trk .meter{position:absolute;left:6px;bottom:0;height:2px;background:var(--ok);width:0}
.trkHead{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:10.5px;letter-spacing:.1em;font-weight:700;padding:2px 4px 4px}
#editor{display:grid;grid-template-rows:auto auto 1fr 96px;gap:6px;padding:8px}
.bar1{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.bank{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;flex:1}
.pad{height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:11px;font-weight:700;position:relative;padding:0}
.pad.has::after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.pad.cur{background:var(--acc);border-color:var(--acc);color:#111}
.pad.cur.has::after{background:#111}
.pad.q{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:#ff7a2f55}}
.bar2{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.lbl{color:var(--dim);font-size:10.5px;letter-spacing:.1em;font-weight:700}
#roll,#lane{width:100%;height:100%;display:block;touch-action:none;border-radius:8px}
.rollWrap{position:relative;min-height:0}
/* ---- bottom ---- */
#bottom{display:grid;grid-template-columns:150px 1fr;gap:8px;min-height:0}
#bottomSide{display:flex;flex-direction:column;gap:6px;padding:8px}
#bottomSide .btn{width:100%}
#bottomMain{position:relative;padding:8px;min-height:0}
#keys{position:absolute;inset:8px}
.wk,.bk{position:absolute;border-radius:0 0 8px 8px;touch-action:none}
.wk{background:#e9ebef;border:1px solid #9aa;top:0;bottom:0}
.bk{background:#20242b;top:0;height:60%;z-index:2;border:1px solid #000}
.wk.dn,.bk.dn{background:var(--acc)}
.wk.root::after{content:attr(data-nm);position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#555;font-size:10px;font-weight:700}
#pads{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:8px}
.dpad{border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:15px;letter-spacing:.06em;touch-action:none}
.dpad.dn{background:var(--acc);color:#111}
#sound{position:absolute;inset:8px;display:flex;flex-direction:column;gap:8px}
.typeRow{display:flex;gap:8px;align-items:center}
.knobs{display:flex;gap:10px 14px;align-items:flex-start;flex-wrap:wrap}
.knob{width:80px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none}
.knob svg{width:68px;height:68px;display:block}
.knob .kl{font-size:10px;color:var(--dim);letter-spacing:.08em;font-weight:700}
.knob .kv{font-size:12px;font-variant-numeric:tabular-nums}
.empty-msg{color:var(--dim);padding:16px}
/* ---- SONG ---- */
#app.songMode{grid-template-rows:52px 1fr}
#app.songMode #bottom{display:none}
#songPage{grid-template-rows:auto 1fr auto;gap:8px}
#songTop{display:flex;align-items:center;gap:8px;padding:8px}
.songStat{background:#0b0d10;border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums;min-width:330px;flex:1}
.songStat b{display:block;font-size:14px}
.songStat span{color:var(--dim);font-size:11px}
#chainWrap{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px;min-height:0}
.blk{display:grid;grid-template-columns:40px repeat(16,1fr);gap:3px;margin-bottom:12px}
.blk .hd{font-size:10.5px;color:var(--dim);text-align:center;font-weight:700;font-variant-numeric:tabular-nums;height:16px;border-radius:4px}
.blk .hd.play{background:var(--acc);color:#111}
.blk .rl{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.06em;display:flex;align-items:center}
.cell{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:12.5px;letter-spacing:.02em;padding:0;min-width:0}
.cell.empty{color:#3d434c;font-weight:600}
.cell.sel{outline:2px solid #fff;outline-offset:-2px}
.cell.l1{color:#ffb27f}.cell.l2{color:#7fd6ff}.cell.l3{color:#c9a6ff}
.cell.rep{height:24px;font-size:11px;color:var(--ink);font-weight:700}
.cell.pc{background:#2e2620}
#sbankWrap{padding:8px 10px}
.sbank{display:grid;grid-template-columns:28px repeat(16,1fr);gap:4px}
.sbank .rl{display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:800}
.sbank .pad{height:38px}
.pad.tgt{outline:2px dashed #ffffff88;outline-offset:-3px}
.btn.armed{background:#3a2a1c;border-color:var(--acc);color:var(--acc)}
.note{color:var(--dim);font-size:11px;line-height:1.5}
/* ---- monitor overlay ---- */
#mon{position:fixed;right:10px;top:62px;width:320px;max-height:70vh;display:none;flex-direction:column;gap:5px;padding:10px;z-index:8;box-shadow:0 10px 40px #000a}
#mon.on{display:flex}
.row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--dim)}
.row b.ok{color:var(--ok)}.row b.warn{color:var(--warn)}.row b.bad{color:var(--bad)}
#log{height:150px;overflow:auto;background:#0b0d10;border-radius:8px;padding:6px;font:10.5px/1.35 ui-monospace,Menlo,monospace;color:#aab;-webkit-user-select:text;user-select:text}
.mrow{display:flex;gap:6px}.mrow .btn{height:32px;flex:1;min-width:0;padding:0 6px;font-size:11.5px}
#startOv{position:fixed;inset:0;background:#0d0f12f2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9}
#startOv h1{margin:0;font-size:22px;letter-spacing:.15em}
#startOv p{margin:0;color:var(--dim);max-width:480px;text-align:center;line-height:1.6}
#editMenu{position:fixed;display:none;flex-direction:column;gap:6px;padding:10px;z-index:8;width:290px;box-shadow:0 10px 40px #000a}
#editMenu.on{display:flex}
#editMenu .btn{height:auto;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
#editMenu .btn small{color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:0}
#editMenu .btn.armed small{color:#ffb27f}
#bEdit.armed{background:#3a2a1c;border-color:var(--acc);color:var(--acc)}
#toast{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:9px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="logo">EMG<small>v0.2.1</small></div>
  <div class="seg"><button class="btn on" id="tabSeq">PATTERN</button><button class="btn" id="tabSong">SONG</button></div>
  <button class="btn big" id="bPlay">▶ PLAY</button>
  <button class="btn big" id="bStop">■ STOP</button>
  <button class="btn rec" id="bRec">● REC</button>
  <button class="btn" id="bMetro">METRO</button>
  <div class="bpm"><button class="btn" id="bpmDn">−</button><b id="bpmV">125</b><button class="btn" id="bpmUp">+</button></div>
  <select id="qSel" title="quantize"><option value="24">Q 1/16</option><option value="12">Q 1/32</option><option value="1">Q OFF</option></select>
  <div class="spacer"></div>
  <button class="btn sm" id="bNew">NEW</button>
  <button class="btn sm" id="bSave">SAVE</button>
  <label class="btn sm" id="bLoad" for="fileIn" style="display:flex;align-items:center">LOAD</label><input id="fileIn" type="file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;left:-9999px">
  <button class="btn sm lampBtn" id="bMon"><span class="lamp" id="lamp"></span><span id="loadV">—</span></button>
 </header>

 <section class="page on" id="seqPage">
  <div class="card" id="tracks"><div class="trkHead"><span>TRACKS</span><span>M&nbsp;&nbsp;&nbsp;&nbsp;S</span></div></div>
  <div class="card" id="editor">
   <div class="bar1">
    <div class="seg" id="bankTabs"></div>
    <div class="bank" id="bank"></div>
   </div>
   <div class="bar2">
    <span class="lbl">LEN</span><div class="seg" id="lenSel"></div>
    <span class="lbl" style="margin-left:6px">PAGE</span><div class="seg" id="pageSel"></div>
    <button class="btn sm" id="bFollow">FOLLOW</button>
    <div class="spacer"></div>
    <span class="lbl" id="noteLenL">NOTE</span><div class="seg" id="nlSel"></div>
    <button class="btn sm" id="octDnR">OCT −</button><button class="btn sm" id="octUpR">OCT +</button>
    <button class="btn sm" id="bEdit">COPY / CLEAR ▾</button>
   </div>
   <div class="rollWrap"><canvas id="roll"></canvas></div>
   <div class="rollWrap"><canvas id="lane"></canvas></div>
  </div>
 </section>

 <section class="page" id="songPage">
  <div class="card" id="songTop">
   <div class="songStat" id="songStat"><b>READY</b><span>セルを選んで、下のパターンをタップすると書き込みます</span></div>
   <button class="btn" id="sClear">CLEAR</button><button class="btn" id="sIns">INSERT</button><button class="btn" id="sDel">DELETE</button>
   <span class="lbl" style="margin-left:6px">REPEAT</span><button class="btn" id="sRepDn">−</button><b id="sRepV" style="min-width:26px;text-align:center;font-size:16px">1</b><button class="btn" id="sRepUp">＋</button>
  </div>
  <div class="card" id="chainWrap"><div id="chain"></div></div>
  <div class="card" id="sbankWrap"><div class="sbank" id="sbank"></div></div>
 </section>

 <section id="bottom">
  <div class="card" id="bottomSide">
   <div class="seg" style="width:100%"><button class="btn on" id="bKeys" style="flex:1">KEYS</button><button class="btn" id="bSound" style="flex:1">SOUND</button></div>
   <div class="lbl" style="margin-top:4px">OCTAVE（ロールと連動）</div>
   <div style="display:flex;gap:6px"><button class="btn sm" id="kOctDn" style="flex:1">−</button><b id="kOctV" style="align-self:center;min-width:20px;text-align:center">3</b><button class="btn sm" id="kOctUp" style="flex:1">+</button></div>
   <div class="lbl" style="margin-top:4px">VELOCITY</div>
   <div class="note" style="font-size:10.5px">鍵盤の下側ほど強く</div>
  </div>
  <div class="card" id="bottomMain">
   <div id="keys"></div>
   <div id="pads" style="display:none"></div>
   <div id="sound" style="display:none"></div>
  </div>
 </section>
</div>

<div class="card" id="mon">
 <div class="row"><span>経過時間</span><b id="mT">0:00:00</b></div>
 <div class="row"><span>状態 / SR</span><b id="mS">-</b></div>
 <div class="row"><span>エンジン負荷</span><b id="mL">-</b></div>
 <div class="row"><span>出力遅延 現在/基準</span><b id="mLag">-</b></div>
 <div class="row"><span>音切れ（時計の停止）</span><b id="mG">0</b></div>
 <div class="row"><span>時計ずれ 累計</span><b id="mD">-</b></div>
 <div class="row"><span>ボイス / ピーク</span><b id="mV">-</b></div>
 <div class="row"><span>自動復旧 回数</span><b id="mR">0</b></div>
 <div class="mrow"><button class="btn on" id="bAuto">自動復旧 ON</button><button class="btn" id="bNewCtx">NEW CTX</button><button class="btn" id="bRep">レポートをコピー</button></div>
 <div id="log"></div>
</div>
<div class="card" id="editMenu">
 <div class="lbl" style="padding:2px 4px 6px">コピー → 貼り付け先のパターンをタップ（複数可）</div>
 <button class="btn" id="cpTrk">COPY TRACK<small>選択トラックのノート</small></button>
 <button class="btn" id="cpPat">COPY PATTERN<small>全トラックのノート・音色・長さ</small></button>
 <button class="btn" id="cpTone">COPY TONE<small>選択トラックの音色</small></button>
 <button class="btn" id="toneAll">TONE → ALL<small>今の音色を全64パターン共通に（2回押し）</small></button>
 <button class="btn" id="bClear">CLEAR TRACK<small>このパターンの選択トラックを消去（2回押し）</small></button>
</div>
<div id="toast"></div>
<div id="startOv"><h1>EMG v0.2.1</h1><p>第2段階：シーケンサーとソング<br>タップして音声を開始します。</p><button class="btn big" id="bStart">START AUDIO</button></div>

<script type="text/plain" id="wkSrc">
class EMG extends AudioWorkletProcessor{
 constructor(o){super();
  const E=this.E=new WebAssembly.Instance(new WebAssembly.Module(o.processorOptions.wasm),{}).exports;
  E.init(sampleRate);
  this.L=new Float32Array(E.memory.buffer,E.out_l(),128);this.R=new Float32Array(E.memory.buffer,E.out_r(),128);
  this.hp=(typeof performance!=="undefined"&&performance&&typeof performance.now==="function");
  this.blk=0;this.busy=0;this.mx=0;this.alive=true;this.sq=0;
  this.port.onmessage=e=>{const a=e.data;if(a&&a.b){for(let i=0;i<a.b.length;i++)this.m(a.b[i])}else this.m(a)};
  this.port.postMessage({ready:1,hp:this.hp});
 }
 m(a){const E=this.E;switch(a[0]){
  case "t":E.set_tempo(a[1]);break;
  case "ms":E.set_master(a[1]);break;
  case "mt":E.set_metro(a[1],a[2]);break;
  case "ty":E.set_type(a[1],a[2]);break;
  case "p":E.set_param(a[1],a[2],a[3]);break;
  case "pv":E.set_live(a[1],a[2],a[3]);break;
  case "mix":E.set_mix(a[1],a[2],a[3],a[4],a[5]);break;
  case "nt":{const p=a[1],t=a[2],f=a[3],n=f.length/5;for(let i=0;i<n;i++){const k=i*5;E.stage(i,f[k],f[k+1],f[k+2],f[k+3],f[k+4])}E.commit(p,t,n);break}
  case "pl":E.set_plen(a[1],a[2]);break;
  case "pa":{const p=a[1],t=a[2],v=a[3];if(v){for(let i=0;i<v.length;i++)E.set_patch(p,t,i,v[i]);E.set_patch_flag(p,t,1)}else E.set_patch_flag(p,t,0);break}
  case "row":E.set_row(a[1],a[2],a[3],a[4],a[5]);break;
  case "sel":E.select_pat(a[1]);break;
  case "pp":E.play_pattern(a[1]);break;
  case "ps":E.play_song(a[1]);break;
  case "jr":E.jump_row(a[1]);break;
  case "stop":E.stop();break;
  case "n":E.note_on(a[1],a[2],a[3]);break;
  case "f":E.note_off(a[1],a[2]);break;
  case "sq":this.sq=a[1];break;
  case "kill":this.alive=false;break;}}
 process(ins,outs){
  if(!this.alive)return false;
  const o=outs[0],l=o[0],n=l.length,E=this.E,hp=this.hp;
  const t0=hp?performance.now():Date.now();
  E.process(n);
  if(n===128){l.set(this.L);if(o[1])o[1].set(this.R)}else{l.set(this.L.subarray(0,n));if(o[1])o[1].set(this.R.subarray(0,n))}
  const dt=(hp?performance.now():Date.now())-t0;this.busy+=dt;if(dt>this.mx)this.mx=dt;
  if(++this.blk>=12){const bms=n/sampleRate*1000;const tp=[];for(let t=0;t<12;t++)tp.push(E.take_tpeak(t));
   this.port.postMessage({pos:E.get_pos(),fr:E.get_frames()-n,bz:this.busy,sp:this.blk*bms,mx:hp?this.mx/bms:-1,v:E.get_voices(),pk:E.take_peak(),pl:E.get_playing(),
    md:E.get_mode(),row:E.get_row(),rep:E.get_rep(),ln:[E.get_lane(0),E.get_lane(1),E.get_lane(2)],q:E.get_queued(),rs:E.get_rowstart(),rl:E.get_rowlen(),bd:E.get_bounds(),end:E.get_ended(),tp,sq:this.sq});
   this.blk=0;this.busy=0;this.mx=0}
  return true}}
registerProcessor("emg-engine",EMG);
</script>

const NT=12,NPAT=64,TPS=24,PPQ=96,MAXROW=128;
const TYPES=["EMPTY","DRUM","BASS","POLY"];

const LANECOL=["#ffb27f","#7fd6ff","#c9a6ff"];
const DRUMS=["BD","SD","CP","LT","MT","HT","CH","OH","RS","CB","CY","RD"];
const KNOBS={1:[[0,"TUNE"],[1,"DECAY"],[2,"TONE"],[3,"DRIVE"]],
 2:[[0,"CUTOFF"],[1,"RESO"],[2,"ENV MOD"],[3,"DECAY"],[4,"DRIVE"],[5,"WAVE",2],[6,"GLIDE"]],
 3:[[0,"CUTOFF"],[1,"RESO"],[7,"ENV AMT"],[2,"ATTACK"],[3,"DECAY"],[4,"SUSTAIN"],[5,"RELEASE"],[6,"DETUNE"]]};
const DEFP={0:[],1:[.5,.5,.5,.15],2:[.25,.55,.6,.3,.2,0,.5],3:[.55,.2,.05,.4,.7,.35,.4,.3]};
function defParams(type){const a=new Array(32).fill(.5);(DEFP[type]||[]).forEach((v,i)=>a[i]=v);return a}
const patName=p=>p<0||p==null?"—":"ABCD"[p>>4]+((p&15)+1);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1300)}

// ================= project data (the engine holds a copy) =================
let D;
function newProject(demo){
 D={format:"EMG_PROJECT",version:2,bpm:125,
  tracks:Array.from({length:NT},(_,i)=>({type:0,vol:.8,pan:0,mute:0,solo:0,P:defParams(0)})),
  pats:Array.from({length:NPAT},()=>({len:16,tr:Array.from({length:NT},()=>[]),patch:Array(NT).fill(null)})),
  chain:Array.from({length:MAXROW},()=>({l:[-1,-1,-1],r:1}))};
 if(demo){
  [[0,1],[1,2],[2,3]].forEach(([t,ty])=>{D.tracks[t].type=ty;D.tracks[t].P=defParams(ty)});
  const p=D.pats[0];
  for(let s=0;s<16;s++){if(s%4===0)p.tr[0].push({t:s*24,n:0,v:120,l:24,f:0});if(s%4===2)p.tr[0].push({t:s*24,n:6,v:s%8===6?110:85,l:24,f:0});if(s===4||s===12)p.tr[0].push({t:s*24,n:1,v:105,l:24,f:0});}
  [[0,36],[2,36],[3,48],[6,39],[8,36],[10,43],[11,36],[14,46]].forEach(([s,n],i)=>p.tr[1].push({t:s*24,n,v:i%3===0?120:95,l:12,f:i===2?1:0}));
  [[0,[60,63,67]],[8,[58,62,65]]].forEach(([s,ns])=>ns.forEach(n=>p.tr[2].push({t:s*24,n,v:95,l:6*24,f:0})));
  D.chain[0]={l:[0,-1,-1],r:2};
 }
}

const U={sel:0,page:"seq",bank:0,editPat:0,viewPage:0,follow:true,noteLen:1,roll:{},drumPart:0,quant:24,rec:false,bottom:"keys",kOct:3,
 songSel:{row:0,lane:0},clip:null,songRec:null};
// ---- engine sync ----
let ctx=null,node=null,wkURL=null,sr=48000,hpWorklet=false,started=false;
function send(m){if(node)node.port.postMessage(m)}
let cmdSeq=0;function sendT(m){send(m);cmdSeq++;send(["sq",cmdSeq])}
function flatNotes(list){const f=[];list.forEach(n=>f.push(n.t,n.n,n.v,n.l,n.f||0));return f}
function syncTrackNotes(p,t){send(["nt",p,t,flatNotes(D.pats[p].tr[t])]);markDirty()}
function syncRow(r){const c=D.chain[r];send(["row",r,c.l[0],c.l[1],c.l[2],c.r]);markDirty()}
function syncMix(t){const k=D.tracks[t];send(["mix",t,k.vol,k.pan,k.mute,k.solo]);markDirty()}
function fullState(){const b=[["t",D.bpm],["ms",.8],["mt",U.metro?1:0,.7]];
 D.tracks.forEach((k,t)=>{b.push(["ty",t,k.type]);k.P.forEach((v,i)=>b.push(["pv",t,i,v]));b.push(["mix",t,k.vol,k.pan,k.mute,k.solo])});
 D.pats.forEach((p,i)=>{b.push(["pl",i,p.len]);p.tr.forEach((l,t)=>{if(l.length)b.push(["nt",i,t,flatNotes(l)])});p.patch.forEach((v,t)=>{if(v)b.push(["pa",i,t,v])})});
 D.chain.forEach((c,r)=>{if(c.l.some(x=>x>=0)||c.r!==1)b.push(["row",r,c.l[0],c.l[1],c.l[2],c.r])});
 b.push(["sel",U.editPat]);
 return {b}}
// note: "p" messages above write live params; engine set_param also creates a patch for the owner pattern.
// To keep the mirror exact, patches are re-sent after the live params (fullState order) and the engine copy is authoritative only for playback.

// ================= ownership (same rule as the engine) =================
let lanes=[0,-1,-1];
function ownerOf(t){for(let l=0;l<3;l++){const p=lanes[l];if(p>=0&&D.pats[p].tr[t].length)return p}return lanes[0]>=0?lanes[0]:lanes[1]>=0?lanes[1]:lanes[2]}

 send(fullState());cmdSeq++;send(["sq",cmdSeq]);
 if(resume){if(resume.md===1)sendT(["ps",resume.row]);else sendT(["pp",resume.pat])}

}
let lastBd=-1,lastEnd=0;

 A.bz+=d.bz;A.sp+=d.sp;if(A.sp>=(hpWorklet?500:4000)){const l=A.bz/A.sp;A.ld=A.ld==null?l:A.ld*.6+l*.4;A.bz=0;A.sp=0}if(d.mx>A.ldWinMax)A.ldWinMax=d.mx;

 if(d.sq!==cmdSeq)return; // the engine has not yet seen our last transport command
 A.anchorPos=d.pl?d.pos:-1;A.anchorFr=d.fr;
 A.rs=d.rs;A.rl=d.rl;A.md=d.md;A.row=d.row;A.rep=d.rep;A.q=d.q;
 const wasPl=A.pl;A.pl=d.pl;
 const lanesChanged=d.ln[0]!==lanes[0]||d.ln[1]!==lanes[1]||d.ln[2]!==lanes[2];
 if(d.bd!==lastBd||lanesChanged){
  const first=lastBd<0;lastBd=d.bd;lanes=d.ln.slice();
  if(!first)onBoundary(lanesChanged);

}

 const ld=(A.ld||0)*100;A.ldMax=Math.max(A.ldMax,A.ldWinMax*100);A.ldWinMax=0;

 if(ctx.state!=="running"){setLamp("warn");return}
 let lag=null;
 if(ctx.getOutputTimestamp){const ts=ctx.getOutputTimestamp();if(ts&&ts.contextTime>0&&ts.performanceTime>0){
  lag=(ctx.currentTime-(ts.contextTime+(now-ts.performanceTime)/1000))*1000;const clk=ts.contextTime*1000-ts.performanceTime;

 if(M.base==null){M.baseBuf.push(lag);if(M.baseBuf.length>=8){const s=[...M.baseBuf].sort((a,b)=>a-b);M.base=s[4];log(`出力遅延 基準 ${M.base.toFixed(1)}ms`)}}
 const over=M.base==null?0:lag-M.base;
 setVal("mLag",`${lag.toFixed(1)} / ${M.base==null?"…":M.base.toFixed(1)} ms`,over>80?"bad":over>40?"warn":"ok");
 setVal("mG",String(M.glitch),M.glitch?"warn":"ok");setVal("mD",`${M.drift.toFixed(1)} ms`,Math.abs(M.drift)>50?"warn":"ok");$("mR").textContent=String(M.recov);
 if(over>80){M.lagHi++;if(M.lagHi===1)log(`出力遅延が基準より ${over.toFixed(0)}ms 増加`)}else M.lagHi=0;
 setLamp(over>80||ld>60?"bad":(over>40||ld>35)?"warn":"ok");
 if(autoRec&&M.lagHi>=4){M.recov++;log("自動復旧: 音声を作り直します");M.lagHi=0;startAudio("auto").catch(err=>log("復旧失敗: "+err))}
}

 box.innerHTML="";box.appendChild(frag);
 $("sRepV").textContent=D.chain[U.songSel.row].r;
 if(playRow>=0&&playRow!==renderChain.lastPlay){renderChain.lastPlay=playRow;const el=box.children[Math.floor(playRow/16)];if(el){const top=el.offsetTop-box.offsetTop;if(top<wrap.scrollTop||top+el.offsetHeight>wrap.scrollTop+wrap.clientHeight)wrap.scrollTop=top-8}}}
(function(){const w=$("chainWrap");let st=null;
 w.addEventListener("pointerdown",e=>{const b=e.target.closest(".cell");st=b?{b,x:e.clientX,y:e.clientY,id:e.pointerId}:null});
 w.addEventListener("pointerup",e=>{if(!st||st.id!==e.pointerId)return;const S=st;st=null;if(Math.hypot(e.clientX-S.x,e.clientY-S.y)<10)songCellTap(+S.b.dataset.r,+S.b.dataset.l)});
 w.addEventListener("pointercancel",()=>{st=null})})();
function songCellTap(r,l){U.songSel={row:r,lane:l};
 if(A.pl&&A.md===1&&rowFilled(r)&&r!==A.row){sendT(["jr",r]);songMsg("JUMP",`次の区切りで STEP ${r+1} へ`)}
 else songMsg(`STEP ${r+1} / ${l<3?"LANE "+(l+1):"REPEAT"}`,l<3?"下のパターンをタップして書き込み":"REPEAT −／＋で回数を変更");
 renderChain()}
function renderSBank(){const box=$("sbank");box.innerHTML="";
 for(let b=0;b<4;b++){const l=document.createElement("div");l.className="rl";l.textContent="ABCD"[b];box.appendChild(l);
  for(let j=0;j<16;j++){const p=b*16+j,btn=document.createElement("button");const has=D.pats[p].tr.some(x=>x.length);
   btn.className="pad"+(has?" has":"")+(A.pl&&A.md===0&&lanes[0]===p?" cur":"")+(A.pl&&A.md===0&&A.q===p?" q":"");btn.textContent=patName(p);btn.onclick=()=>songPick(p);box.appendChild(btn)}}}
function songPick(p){
 if(U.songRec&&A.pl){sendT(["sel",p]);A.q=p;songMsg("SONG REC",`次の区切りで ${patName(p)} へ`);renderSBank();return}
 const s=U.songSel;U.editPat=p;U.bank=p>>4;
 if(s.lane>2){songMsg("LANE を選んでください","REPEAT のセルにはパターンを書き込めません");return}
 D.chain[s.row].l[s.lane]=p;syncRow(s.row);songMsg("WRITE",`STEP ${s.row+1} / LANE ${s.lane+1} = ${patName(p)}`);
 if(s.row<MAXROW-1)U.songSel={row:s.row+1,lane:s.lane};
 renderChain()}
function songMsg(a,b){$("songStat").innerHTML=`<b>${a}</b><span>${b||""}</span>`}
function renderSongStat(){}
$("sClear").onclick=()=>{const s=U.songSel;if(s.lane>2){D.chain[s.row].r=1}else D.chain[s.row].l[s.lane]=-1;syncRow(s.row);renderChain()};
$("sIns").onclick=()=>{const r=U.songSel.row;D.chain.splice(r,0,{l:[-1,-1,-1],r:1});D.chain.length=MAXROW;for(let i=r;i<MAXROW;i++)syncRow(i);renderChain();songMsg("INSERT",`STEP ${r+1} に空きを挿入`)};
$("sDel").onclick=()=>{const r=U.songSel.row;D.chain.splice(r,1);D.chain.push({l:[-1,-1,-1],r:1});for(let i=r;i<MAXROW;i++)syncRow(i);renderChain();songMsg("DELETE",`STEP ${r+1} を削除して詰めました`)};
$("sRepDn").onclick=()=>{const c=D.chain[U.songSel.row];c.r=Math.max(1,c.r-1);syncRow(U.songSel.row);renderChain()};
$("sRepUp").onclick=()=>{const c=D.chain[U.songSel.row];c.r=Math.min(99,c.r+1);syncRow(U.songSel.row);renderChain()};

// ================= iOS: no double-tap / pinch zoom =================
(function(){let last=0;
 document.addEventListener("touchend",e=>{const now=Date.now();if(now-last<350&&!(e.target.closest&&e.target.closest("label")))e.preventDefault();last=now},{passive:false});
 // buttons react on touch-down (no waiting for the finger to lift); the later native click is swallowed
 document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button");if(!b||b.disabled||b.closest("#chainWrap"))return;b.__pd=performance.now();b.click()},true);
 document.addEventListener("click",e=>{if(!e.isTrusted)return;const b=e.target.closest&&e.target.closest("button");if(b&&b.__pd&&performance.now()-b.__pd<2000){b.__pd=0;e.stopPropagation();e.preventDefault()}},true);
 ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
 document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
 document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault();else if(!e.target.closest("#chainWrap,#log"))e.preventDefault()},{passive:false});})();

// ================= boot =================
function renderAll(){showOct();renderTracks();renderBank();renderBar();renderBottom();if(U.page==="song"){renderChain();renderSBank()}needDraw=true}
let lastSongPaint=0;
setInterval(()=>{if(U.page==="song"&&A.pl){renderChain();renderSBank()}if(A.pl&&U.page==="seq")renderBank()},400);
function boot(){
 let z=null;try{z=JSON.parse(localStorage.getItem("emg_v02_autosave")||"null")}catch(_){}
 if(validProject(z)){loadProject(z);log("前回の作業を復元しました")}else newProject(true);
 lanes=[U.editPat,-1,-1];applyOwnersToMirror();$("bpmV").textContent=D.bpm;sizeCanvases();renderAll();requestAnimationFrame(frame)}
window.addEventListener("resize",()=>{sizeCanvases();renderBottom()});
try{const ro=new ResizeObserver(()=>{sizeCanvases()});ro.observe(roll.parentNode);ro.observe(lane.parentNode)}catch(_){}
boot();
$("bStart").onclick=async()=>{try{await startAudio("start");$("startOv").style.display="none"}catch(err){log("start failed: "+err);document.querySelector("#startOv p").textContent="音声を開始できませんでした: "+err}};
</script>
